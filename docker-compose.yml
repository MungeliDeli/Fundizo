# Local development services. Never used in production (AWS RDS / ElastiCache there).
name: fundizo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fundizo
      POSTGRES_PASSWORD: fundizo_dev_only
      POSTGRES_DB: fundizo
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fundizo -d fundizo']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
