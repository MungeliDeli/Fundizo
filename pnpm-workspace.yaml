packages:
  - apps/*
  - packages/*

# Supply-chain safety: never install a version published less than 14 days ago.
minimumReleaseAge: 20160

# Only these packages may run install scripts (esbuild downloads its native binary).
allowBuilds:
  esbuild: true
  # Optional native speed-up for BullMQ's msgpackr; the pure-JS fallback is fine.
  msgpackr-extract: false
